name: Apply registration profile fix
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch registration session and profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/crackneet/app/MainActivity.java')
          s=p.read_text()

          s=s.replace('String pendingProfileName="",pendingProfileEmail="";', 'String pendingProfileName="",pendingProfileEmail="",pendingProfileCreatedAt="";', 1)
          s=s.replace('void saveSession(long id,String token){ userId=id; authToken=token; getSharedPreferences("crackneet_session",MODE_PRIVATE).edit().putLong("userId",id).putString("token",token).putString("name",profileNameSafe(id)).putString("email",profileEmailSafe(id)).apply(); }', 'void saveSession(long id,String token){ userId=id; authToken=token; getSharedPreferences("crackneet_session",MODE_PRIVATE).edit().putLong("userId",id).putString("token",token).putString("name",profileNameSafe(id)).putString("email",profileEmailSafe(id)).putString("createdAt",pendingProfileCreatedAt).apply(); }', 1)
          s=s.replace('pendingProfileEmail=u.optString("email",""); saveSession(u.getLong("id"),out.getString("token"));', 'pendingProfileEmail=u.optString("email",""); pendingProfileCreatedAt=u.optString("created_at",""); saveSession(u.getLong("id"),out.getString("token"));', 1)
          s=s.replace('pendingProfileEmail=u.optString("email","");saveSession(u.getLong("id"),out.getString("token"));', 'pendingProfileEmail=u.optString("email",""); pendingProfileCreatedAt=u.optString("created_at","");saveSession(u.getLong("id"),out.getString("token"));', 1)

          if 'String profileCreatedAt=sp.getString("createdAt","");' not in s:
              s=s.replace('profileName=sp.getString("name","Student"); profileEmail=sp.getString("email","");', 'profileName=sp.getString("name","Student"); profileEmail=sp.getString("email","");\n        String profileCreatedAt=sp.getString("createdAt","");', 1)

          if 'Account ID:  "+userId' not in s:
              s=s.replace('content.addView(head,new LinearLayout.LayoutParams(-1,dp(120)));\n        LinearLayout stats=', 'content.addView(head,new LinearLayout.LayoutParams(-1,dp(120)));\n        LinearLayout accountInfo=box(); accountInfo.setBackground(bg(Color.WHITE,18));\n        accountInfo.addView(tv("Account ID:  "+userId,14,TEXT,true));\n        String memberSince=profileCreatedAt.length()>0?profileCreatedAt.replace("T"," ").replace("Z",""):"Not available";\n        accountInfo.addView(tv("Member Since:  "+memberSince,13,MUTED,false));\n        content.addView(accountInfo,new LinearLayout.LayoutParams(-1,dp(92)));\n        LinearLayout stats=', 1)

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/crackneet/app/MainActivity.java
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "Save registration data and show it in profile"
          git push
