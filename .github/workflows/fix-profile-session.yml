name: Sync profile fields

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  sync-profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Patch Android profile session
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/crackneet/app/MainActivity.java')
          s = p.read_text()

          old = 'String pendingProfileName="",pendingProfileEmail="";'
          new = 'String pendingProfileName="",pendingProfileEmail="",pendingProfileCreatedAt="";'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'void saveSession(long id,String token){ userId=id; authToken=token; getSharedPreferences("crackneet_session",MODE_PRIVATE).edit().putLong("userId",id).putString("token",token).putString("name",profileNameSafe(id)).putString("email",profileEmailSafe(id)).apply(); }'
          new = 'void saveSession(long id,String token){ userId=id; authToken=token; getSharedPreferences("crackneet_session",MODE_PRIVATE).edit().putLong("userId",id).putString("token",token).putString("name",profileNameSafe(id)).putString("email",profileEmailSafe(id)).putString("createdAt",pendingProfileCreatedAt).apply(); }'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'JSONObject u=out.getJSONObject("user"); pendingProfileName=u.optString("name","Student"); pendingProfileEmail=u.optString("email",""); saveSession(u.getLong("id"),out.getString("token"));'
          new = 'JSONObject u=out.getJSONObject("user"); pendingProfileName=u.optString("name","Student"); pendingProfileEmail=u.optString("email",""); pendingProfileCreatedAt=u.optString("created_at",""); saveSession(u.getLong("id"),out.getString("token"));'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'JSONObject u=out.getJSONObject("user");pendingProfileName=u.optString("name","Student"); pendingProfileEmail=u.optString("email","");saveSession(u.getLong("id"),out.getString("token"));'
          new = 'JSONObject u=out.getJSONObject("user");pendingProfileName=u.optString("name","Student"); pendingProfileEmail=u.optString("email",""); pendingProfileCreatedAt=u.optString("created_at","");saveSession(u.getLong("id"),out.getString("token"));'
          if old in s:
              s = s.replace(old, new, 1)

          marker = 'profileName=sp.getString("name","Student"); profileEmail=sp.getString("email","");'
          insert = marker + '\n        String profileCreatedAt=sp.getString("createdAt","");'
          if marker in s and 'String profileCreatedAt=sp.getString("createdAt","");' not in s:
              s = s.replace(marker, insert, 1)

          marker = 'content.addView(head,new LinearLayout.LayoutParams(-1,dp(120)));\n        LinearLayout stats='
          insert = 'content.addView(head,new LinearLayout.LayoutParams(-1,dp(120)));\n        LinearLayout accountInfo=box(); accountInfo.setBackground(bg(Color.WHITE,18));\n        accountInfo.addView(tv("Account ID:  "+userId,14,TEXT,true));\n        String memberSince=profileCreatedAt.length()>0?profileCreatedAt.replace("T"," ").replace("Z",""):"Not available";\n        accountInfo.addView(tv("Member Since:  "+memberSince,13,MUTED,false));\n        content.addView(accountInfo,new LinearLayout.LayoutParams(-1,dp(92)));\n        LinearLayout stats='
          if marker in s and 'Account ID:  "+userId' not in s:
              s = s.replace(marker, insert, 1)

          p.write_text(s)
          PY

      - name: Commit profile sync
        run: |
          if git diff --quiet; then
            echo "No profile changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/crackneet/app/MainActivity.java
          git commit -m "Sync profile with registration data"
          git push
