services:
  postgres:
    image: postgres:16-alpine
    container_name: crackneet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crackneet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - crackneet_pgdata:/var/lib/postgresql/data
volumes:
  crackneet_pgdata:
